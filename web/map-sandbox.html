<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>go+ map sandbox</title>
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #e5e3df;
      }
      .map-popup {
        display: block;
        width: 100%;
        max-width: 260px;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: #102033;
        font: 13px/1.35 "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        text-align: left;
        cursor: pointer;
      }
      .map-popup strong {
        display: block;
        margin-bottom: 2px;
      }
      .map-popup-meta {
        color: #4d5d78;
        font-size: 12px;
      }
      .map-popup-cta {
        display: block;
        margin-top: 6px;
        color: #0b5cab;
        font-size: 12px;
        font-weight: 600;
      }
      .map-popup:hover .map-popup-cta {
        text-decoration: underline;
      }
      /* Drop Google Maps InfoWindow title/close chrome (empty header). */
      .gm-style-iw-chr {
        display: none !important;
      }
      .gm-style-iw-c {
        padding: 10px 12px !important;
      }
      .gm-style-iw-d {
        overflow: visible !important;
        max-height: none !important;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="map-sandbox.js"></script>
  </body>
</html>
